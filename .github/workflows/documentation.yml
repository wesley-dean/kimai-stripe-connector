---
name: Documentation

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doxygen:
    name: Generate Doxygen reference
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Generate reference documentation
        shell: bash
        run: |
          set -euo pipefail

          php_source="$(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './tests/*' \
            -not -path './doc/*' \
            -print -quit)"

          if [[ -z ${php_source} ]]; then
            echo 'No maintained PHP source exists yet; Doxygen generation is deferred.'
            exit 0
          fi

          doxygen Doxyfile
          test -f doc/reference/index.html

      - name: Verify generated reference output is ignored
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f doc/reference/index.html ]]; then
            git check-ignore -q doc/reference/index.html
            test -z "$(git status --porcelain --untracked-files=all -- doc/reference)"
          fi
