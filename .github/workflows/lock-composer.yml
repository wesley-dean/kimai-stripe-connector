---
name: Lock Composer dependencies

# Temporary implementation-preparation workflow.  Remove after composer.lock is
# committed and ordinary PHP CI has been switched to composer install.
# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up minimum supported PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # pin@2.37.2
        with:
          php-version: "8.2"
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Resolve minimum-PHP dependency graph
        run: composer update --no-interaction --prefer-dist

      - name: Validate generated lockfile
        run: composer validate --strict --no-check-publish

      - name: Commit generated lockfile
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --quiet -- composer.lock && git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo 'composer.lock is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'chore: lock Composer dependencies'
          git push origin "HEAD:${HEAD_REF}"
