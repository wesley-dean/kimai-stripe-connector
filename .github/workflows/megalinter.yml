---
name: MegaLinter

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APPLY_FIXES: false

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # pin@2.37.2
        with:
          php-version: "8.3"
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/php@15e5b45552097e318c93de385779ce3b1084052c # pin@v10.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            megalinter-reports/megalinter.log

      - name: Check for SARIF report
        id: sarif_file_exists
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # pin@v3.1.0
        with:
          files: "megalinter-reports/megalinter-report.sarif"

      - name: Upload MegaLinter scan results to GitHub Security tab
        if: |
          steps.sarif_file_exists.outputs.files_exists == 'true'
          && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # pin@v3.29.5
        with:
          sarif_file: "megalinter-reports/megalinter-report.sarif"
