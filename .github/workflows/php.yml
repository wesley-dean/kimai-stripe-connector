---
name: PHP

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # pin@2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      # Until composer.lock is committed, resolve the graph independently on each
      # supported PHP runtime so dependency/tool incompatibilities are visible.
      # After the minimum-PHP lock artifact is committed, this becomes
      # `composer install` from the repository lockfile.
      - name: Resolve and install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Preserve minimum-PHP lockfile candidate
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: composer-lock-php82
          path: composer.lock
          if-no-files-found: error

      - name: Run project PHP checks
        run: composer check
