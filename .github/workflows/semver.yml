---
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Versioning
permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  versioning:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] git-auto-semver creates and pushes the release tag.
          persist-credentials: true
          fetch-tags: true

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # pin@2.40.0
        with:
          php-version: "8.3"
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: calculate version
        id: calculate-version
        uses: bitshifted/git-auto-semver@c4e8f005e839f822325356f141939cf6c76b5701 # pin@v1
        with:
          create_tag: true
          initial_version: 0.0.1
          tag_prefix: v

      - name: Build self-contained plugin artifact
        env:
          VERSION: "${{ steps.calculate-version.outputs.version-string }}"
        run: |
          composer validate --strict
          make package VERSION="v${VERSION}"
          cd dist
          sha256sum --check "KimaiStripeConnectorBundle-v${VERSION}.zip.sha256"

      - name: Generate release notes
        id: release-notes
        uses: RedCrafter07/release-notes-action@304edb57ff4d0cb822b39a00556c015790dee977 # pin@v1.0.2
        with:
          tag-name: "v${{ steps.calculate-version.outputs.version-string }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Create release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_NOTES: "${{ steps.release-notes.outputs.release-notes }}"
          VERSION: "${{ steps.calculate-version.outputs.version-string }}"
        run: |
          gh release create "v${VERSION}" \
            "dist/KimaiStripeConnectorBundle-v${VERSION}.zip" \
            "dist/KimaiStripeConnectorBundle-v${VERSION}.zip.sha256" \
            --title "v${VERSION}" \
            --notes "${RELEASE_NOTES}" \
            --verify-tag
