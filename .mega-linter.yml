---
# Don't use MegaLinter to test reports or generated artifacts.
ADDITIONAL_EXCLUDED_DIRECTORIES: [report, megalinter-reports, .git, site]

# Don't scan files listed in .gitignore (vendor, build output, generated docs, etc.).
IGNORE_GITIGNORED_FILES: true

# Disable linters that are genuinely outside the project's adopted toolchain or
# have known project-specific limitations.  PHPStan is the project's static
# analyzer; running an unconfigured second analyzer (Psalm) would create a second,
# conflicting static-analysis contract rather than additional enforcement.
DISABLE_LINTERS:
  [
    REPOSITORY_DEVSKIM,
    REPOSITORY_DUSTILOCK,
    REPOSITORY_OSV_SCANNER,
    SPELL_PROSELINT,
    COPYPASTE_JSCPD,
    BASH_EXEC,
    SPELL_LYCHEE,
    PHP_PSALM,
    EDITORCONFIG_EDITORCONFIG_CHECKER,
  ]

# The repository is deliberately small.  Lint the complete codebase so the quality
# gate does not depend on fetching Git history or persisted checkout credentials,
# and so a green run means the repository as a whole is warning/error free.
VALIDATE_ALL_CODEBASE: true

# Don't print the alpaca -- it's cute, but we don't need it in the logs.
PRINT_ALPACA: false

# Fail the workflow when MegaLinter finds errors.
DISABLE_ERRORS: false

# Avoid API reporter chatter on private-repository pull requests.  GitHub Actions
# itself remains the source of workflow status and report artifacts.
GITHUB_COMMENT_REPORTER: false

# Project-owned PHP linter configuration.
PHP_PHPCS_CONFIG_FILE: phpcs.xml
PHP_PHPSTAN_CONFIG_FILE: phpstan.neon.dist
PHP_PHPCSFIXER_CONFIG_FILE: .php-cs-fixer.dist.php
SPELL_CSPELL_CONFIG_FILE: .cspell.json

# The preserved ADR-001 rationale is intentionally a historical snapshot.  Keep
# its prose and table whitespace unchanged; maintained Markdown remains subject to
# markdownlint and markdown-table-formatter.
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: >-
  ^doc/adr/rationale/
MARKDOWN_MARKDOWN_TABLE_FORMATTER_FILTER_REGEX_EXCLUDE: >-
  ^doc/adr/rationale/

# Zizmor needs the workflow token for online audits of pinned public actions.
# MegaLinter filters environment variables from linters unless explicitly allowed.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# Use Prettier for JavaScript code formatting.
JAVASCRIPT_DEFAULT_STYLE: prettier

# MegaLinter supports SARIF reporters; upload is gated by repository visibility.
SARIF_REPORTER: true

# Don't scan the .git directory GitHub creates at runtime.
REPOSITORY_TRUFFLEHOG_ARGUMENTS: "--exclude-paths=.trufflehogignore"

# Make sure Terraform modules are present when Checkov is applicable.
REPOSITORY_CHECKOV_ARGUMENTS: "--download-external-modules true"

# Make sure Common Platform Enumerations (CPEs) are present when Grype is applicable.
REPOSITORY_GRYPE_ARGUMENTS: "--add-cpes-if-none"

# Start each run with a clean report directory.
CLEAR_REPORT_FOLDER: true

# shfmt conventions for repository shell code.
BASH_SHFMT_ARGUMENTS: -i 2 -bn -ci -sr -kp
