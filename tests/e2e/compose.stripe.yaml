---
services:
  kimai:
    environment:
      KIMAI_STRIPE_CONNECTOR_ENABLED: "true"
      KIMAI_STRIPE_CONNECTOR_PAYMENT_LINKS_ENABLED: "true"
      KIMAI_STRIPE_CONNECTOR_RECONCILIATION_ENABLED: "true"
      KIMAI_STRIPE_CONNECTOR_INSTANCE_ID: ${KIMAI_STRIPE_CONNECTOR_INSTANCE_ID:?KIMAI_STRIPE_CONNECTOR_INSTANCE_ID must be set}
      KIMAI_STRIPE_CONNECTOR_STRIPE_API_KEY: ${STRIPE_SANDBOX_RESTRICTED_KEY:?STRIPE_SANDBOX_RESTRICTED_KEY must be set}
