---
services:
  sqldb:
    image: mysql:8.3
    environment:
      MYSQL_DATABASE: kimai
      MYSQL_USER: kimaiuser
      MYSQL_PASSWORD: e2e-kimai-password
      MYSQL_ROOT_PASSWORD: e2e-root-password
    command: --default-storage-engine innodb
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - -uroot
        - -pe2e-root-password
        - ping
        - -h
        - 127.0.0.1
        - --silent
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    volumes:
      - mysql:/var/lib/mysql

  kimai:
    image: kimai/kimai2:2.65.0
    depends_on:
      sqldb:
        condition: service_healthy
        restart: true
    environment:
      APP_SECRET: e2e-only-app-secret-not-for-production
      # Kimai expects TRUSTED_HOSTS as a pipe-separated regular expression.
      TRUSTED_HOSTS: 'localhost|127\.0\.0\.1|kimai'
      ADMINMAIL: e2e@example.invalid
      ADMINPASS: e2e-admin-password
      DATABASE_URL: ${E2E_DATABASE_URL:?E2E_DATABASE_URL must be set}
      KIMAI_STRIPE_CONNECTOR_ENABLED: "false"
    ports:
      - "127.0.0.1::8001"
    volumes:
      - data:/opt/kimai/var/data
      - plugins:/opt/kimai/var/plugins
    # Kimai's image healthcheck is correct for steady-state operation, but a
    # pristine instance performs migrations and first-run initialization before
    # Apache is reliably ready.  Preserve the upstream probe cadence while giving
    # that initialization a deliberately generous grace period.  This mirrors the
    # behavior needed in the reference deployment and prevents the disposable E2E
    # environment from consuming its retry budget during normal startup work.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8001 || exit 1
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30m

volumes:
  data:
  mysql:
  plugins:
